<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>ScoreFlow Pro</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.4.120/pdf.min.js"></script>
    <script>pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.4.120/pdf.worker.min.js';</script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/face_mesh/face_mesh.js" crossorigin="anonymous"></script>
    <style>
        :root { --apple-bg: #121212; --apple-bar: rgba(25, 25, 25, 0.9); --apple-accent: #0071e3; --apple-success: #34c759; --apple-gray: rgba(255, 255, 255, 0.12); --apple-card: rgba(35, 35, 35, 0.96); }
        body { font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", sans-serif; margin: 0; padding: 0; background-color: var(--apple-bg); color: #ffffff; height: 100vh; overflow: hidden; -webkit-font-smoothing: antialiased; position: relative; }
        header { width: 100%; backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px); background: var(--apple-bar); border-bottom: 1px solid rgba(255, 255, 255, 0.05); padding: 0 20px; display: flex; justify-content: space-between; align-items: center; box-sizing: border-box; z-index: 100; height: 56px; position: absolute; top: 0; left: 0; transition: transform 0.3s cubic-bezier(0.25, 1, 0.5, 1); }
        body.fullscreen-mode header { transform: translateY(-100%); }
        body.fullscreen-mode.show-menu header { transform: translateY(0); }
        .logo { font-weight: 600; font-size: 16px; letter-spacing: -0.3px; color: #fff; }
        .controls { display: flex; align-items: center; gap: 8px; flex-wrap: nowrap; }
        .btn-control { background-color: var(--apple-gray); color: #ffffff; padding: 0 12px; height: 38px; border-radius: 10px; border: none; cursor: pointer; transition: all 0.2s cubic-bezier(0.25, 1, 0.5, 1); display: flex; align-items: center; justify-content: center; gap: 6px; box-sizing: border-box; flex-shrink: 0; position: relative; font-size: 13px; font-weight: 500; user-select: none; -webkit-user-select: none; white-space: nowrap; }
        .btn-control:hover { background-color: rgba(255,255,255,0.2); }
        .btn-control:active { transform: scale(0.96); }
        .btn-control svg { width: 18px; height: 18px; fill: currentColor; }
        .btn-text { display: inline; } 
        .btn-control.active-vision { background-color: var(--apple-success); color: white; }
        .btn-control.active-dark { background-color: #ffffff; color: #000000; }
        .btn-control.active-pencil { background-color: #ff9500; color: white; }
        .midi-indicator { width: 6px; height: 6px; background-color: #ff3b30; border-radius: 50%; position: absolute; top: 4px; right: 4px; }
        .midi-indicator.connected { background-color: var(--apple-success); box-shadow: 0 0 4px var(--apple-success); }
        #score-container { position: absolute; top: 56px; bottom: 0; left: 0; right: 0; overflow-y: scroll; scroll-behavior: smooth; padding: 20px 0; box-sizing: border-box; -webkit-overflow-scrolling: touch; transition: top 0.3s cubic-bezier(0.25, 1, 0.5, 1); z-index: 1; }
        #score-container::-webkit-scrollbar { display: none; } 
        body.fullscreen-mode #score-container { top: 0; }
        body.fullscreen-mode.show-menu #score-container { top: 56px; }
        body.pencil-locked #score-container { overflow-y: hidden !important; }
        .page-wrapper { position: relative; margin: 0 auto 24px auto; width: 92%; max-width: 820px; box-shadow: 0 10px 35px rgba(0,0,0,0.6); }
        .pdf-page-canvas { background: white; display: block; width: 100%; height: auto; transition: filter 0.3s ease; }
        .pdf-page-canvas.dark-score { filter: invert(0.92) contrast(1.15) brightness(1.05); }
        .annotation-canvas { position: absolute; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none; touch-action: none; z-index: 5; }
        body.pencil-locked .annotation-canvas { pointer-events: auto; }
        
        /* 畫筆工具列 */
        #pencil-toolbar { position: fixed; bottom: 24px; left: 24px; background: rgba(30,30,30,0.88); backdrop-filter: blur(15px); -webkit-backdrop-filter: blur(15px); border-radius: 14px; padding: 8px 14px; display: none; align-items: center; gap: 8px; z-index: 250; border: 1px solid rgba(255,255,255,0.12); box-shadow: 0 8px 32px rgba(0,0,0,0.5); }
        .color-group-label { font-size: 10px; color: #8e8e93; margin-right: 2px; }
        .color-dot { width: 22px; height: 22px; border-radius: 50%; cursor: pointer; border: 2px solid transparent; transition: transform 0.1s ease; box-sizing: border-box; }
        .color-dot.selected { border-color: #fff; transform: scale(1.2); }
        .color-picker-wrapper { position: relative; width: 22px; height: 22px; border-radius: 50%; overflow: hidden; border: 1px solid rgba(255,255,255,0.3); cursor: pointer; }
        .color-picker-wrapper input[type="color"] { position: absolute; top: -5px; left: -5px; width: 32px; height: 32px; border: none; background: none; cursor: pointer; }
        
        #placeholder { display: flex; flex-direction: column; justify-content: center; align-items: center; height: 60vh; color: #888; text-align: center; padding: 20px; }
        .hud-panel { position: fixed; bottom: 24px; left: 50%; transform: translateX(-50%); background: rgba(0, 0, 0, 0.95); color: #fff; padding: 10px 24px; border-radius: 20px; font-size: 13px; font-weight: 500; pointer-events: none; z-index: 500; opacity: 0; transition: opacity 0.2s ease; box-shadow: 0 4px 16px rgba(0,0,0,0.5); border: 1px solid rgba(255,255,255,0.1); text-align: center; }
        .hud-panel.show { opacity: 1; }
        #camera-preview-container { position: fixed; bottom: 16px; left: 16px; width: 64px; height: 48px; border-radius: 6px; overflow: hidden; border: 1px solid rgba(255,255,255,0.1); z-index: 150; background: #000; transform: scaleX(-1); display: none; opacity: 0.2; }
        #webcam { width: 100%; height: 100%; object-fit: cover; }
        .floating-fullscreen-btn { position: fixed; bottom: 24px; right: 24px; width: 46px; height: 46px; border-radius: 50%; background: rgba(30, 30, 30, 0.75); backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px); border: 1px solid rgba(255, 255, 255, 0.15); color: #ffffff; display: flex; align-items: center; justify-content: center; cursor: pointer; z-index: 250; box-shadow: 0 4px 16px rgba(0,0,0,0.3); transition: all 0.2s ease; }
        
        /* 設定面板面板 */
        .modal-overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0, 0, 0, 0.5); backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px); display: flex; justify-content: center; align-items: center; z-index: 300; opacity: 0; pointer-events: none; transition: opacity 0.2s ease; }
        .modal-overlay.open { opacity: 1; pointer-events: auto; }
        .modal-card { background: var(--apple-card); border: 1px solid rgba(255,255,255,0.1); border-radius: 16px; padding: 20px; width: 92%; max-width: 400px; color: white; box-sizing: border-box; max-height: 85vh; overflow-y: auto; }
        .modal-card::-webkit-scrollbar { display: none; }
        .setting-item { display: flex; flex-direction: column; gap: 6px; margin-bottom: 12px; background: rgba(255,255,255,0.04); padding: 12px; border-radius: 10px; }
        .setting-label { font-size: 12px; color: #bbb; display: flex; justify-content: space-between; align-items: center; }
        .bind-tag { background: rgba(0, 113, 227, 0.2); border: 1px solid var(--apple-accent); color: #3a96ff; padding: 2px 6px; border-radius: 4px; font-size: 11px; }
        select { background: #2c2c2e; color: white; border: none; padding: 6px; border-radius: 6px; font-size: 12px; width: 100%; outline: none; }
        input[type="range"] { width: 100%; accent-color: var(--apple-accent); margin-top: 4px; }
        .num-input { background: #2c2c2e; border: 1px solid rgba(255,255,255,0.15); border-radius: 6px; color: #fff; padding: 4px 8px; width: 70px; text-align: center; font-size: 13px; font-weight: 600; outline: none; }
        .num-input:focus { border-color: var(--apple-accent); background: #3a3a3c; }
        
        /* 節拍器對稱方塊 */
        .metro-box { position: fixed; width: 24px; height: 24px; border-radius: 6px; background-color: rgba(255,255,255,0.06); border: 1px solid rgba(255,255,255,0.1); z-index: 99; opacity: 0; pointer-events: none; transition: opacity 0.1s ease, background-color 0.05s ease; }
        .metro-box.active-flash { opacity: 1 !important; background-color: var(--apple-accent); box-shadow: 0 0 20px var(--apple-accent); }
        .btn-circle-anchor { border-radius: 50%; width: 36px; height: 36px; padding: 0; font-size: 14px; font-weight: 600; background: var(--apple-gray); border: none; color: #fff; cursor: pointer; display: flex; align-items: center; justify-content: center; transition: all 0.2s cubic-bezier(0.25, 1, 0.5, 1); user-select: none; -webkit-user-select: none; }
        .btn-circle-anchor.has-data { background: rgba(0, 113, 227, 0.15); border: 1px solid var(--apple-accent); color: #3a96ff; }
        
        @media (max-width: 768px) {
            header { padding: 0 8px; } .logo { display: none; } .controls { width: 100%; justify-content: space-between; gap: 4px; }
            .btn-control { padding: 0 8px; height: 36px; border-radius: 8px; font-size: 11px; gap: 4px; } .btn-control .btn-text { display: none; }
            #btn-mode .btn-text, #lbl-mode { display: inline !important; }
        }
    </style>
</head>
<body>
    <div id="metro-left" class="metro-box"></div>
    <div id="metro-right" class="metro-box"></div>

    <header id="top-bar">
        <div class="logo">ScoreFlow Pro</div>
        <div class="controls">
            <label class="btn-control"><svg viewBox="0 0 24 24"><path d="M19 13h-6v6h-2v-6H5v-2h6V5h2v6h6v2z"/></svg><span class="btn-text">載入</span><input type="file" id="file-input" accept="application/pdf" style="display: none;"></label>
            <button class="btn-control" onclick="triggerPDFExport(event)"><svg viewBox="0 0 24 24"><path d="M19 9h-4V3H9v6H5l7 7 7-7zM5 18v2h14v-2H5z"/></svg><span class="btn-text">匯出(含筆記)</span></button>
            <button id="btn-anchor-1" class="btn-circle-anchor" onclick="handleAnchorClick('1', event)">①</button>
            <button id="btn-anchor-2" class="btn-circle-anchor" onclick="handleAnchorClick('2', event)">②</button>
            <button id="btn-pencil" class="btn-control" onclick="togglePencilMode(event)"><svg viewBox="0 0 24 24"><path d="M3 17.25V21h3.75L17.81 9.94l-3.75-3.75L3 17.25zM20.71 7.04c.39-.39.39-1.02 0-1.41l-2.34-2.34c-.39-.39-1.02-.39-1.41 0l-1.83 1.83 3.75 3.75 1.83-1.83z"/></svg><span class="btn-text">畫筆</span></button>
            <button id="btn-mode" class="btn-control" onclick="toggleControlMode(event)"><svg viewBox="0 0 24 24"><path d="M12 2c-4.97 0-9 4.03-9 9 0 2.12.74 4.07 1.97 5.61L4.35 19.4c-.39.39-.39 1.02 0 1.41.39.39 1.02.39 1.41 0l2.79-2.79C10.09 18.66 11.03 19 12 19c4.97 0 9-4.03 9-9s-4.03-9-9-9zm0 15c-3.31 0-6-2.69-6-6s2.69-6 6-6 6 2.69 6 6-2.69 6-6 6z"/></svg><span class="btn-text" id="lbl-mode">鍵盤/MIDI</span><span id="midi-dot" class="midi-indicator"></span></button>
            <button id="btn-dark" class="btn-control" onclick="toggleDarkScore(event)"><svg viewBox="0 0 24 24"><path d="M12 3c-4.97 0-9 4.03-9 9s4.03 9 9 9 9-4.03 9-9c0-.46-.04-.92-.1-1.36-.98 1.37-2.58 2.26-4.4 2.26-2.98 0-5.4-2.42-5.4-5.4 0-1.81.89-3.42 2.26-4.4-.44-.06-.9-.1-1.36-.1z"/></svg><span class="btn-text">深色</span></button>
            <button class="btn-control" onclick="openSettings(event)"><svg viewBox="0 0 24 24"><path d="M19.14 12.94c.04-.3.06-.61.06-.94 0-.32-.02-.64-.07-.94l2.03-1.58c.18-.14.23-.41.12-.61l-1.92-3.32c-.12-.22-.37-.29-.59-.22l-2.39.96c-.5-.38-1.03-.7-1.62-.94l-.36-2.54c-.04-.24-.24-.41-.48-.41h-3.84c-.24 0-.43.17-.47.41l-.36 2.54c-.59.24-1.13.57-1.62.94l-2.39-.96c-.22-.08-.47 0-.59.22L2.74 8.87c-.12.21-.08.47.12.61l2.03 1.58c-.05.3-.09.63-.09.94s.02.64.07.94l-2.03 1.58c-.18.14-.23.41-.12.61l1.92 3.32c.12.22.37.29.59.22l2.39-.96c.5.38 1.03.7 1.62.94l.36 2.54c.05.24.24.41.48.41h3.84c.24 0 .44-.17.47-.41l.36-2.54c.59-.24 1.13-.56 1.62-.94l2.39.96c.22.08.47 0 .59-.22l1.92-3.32c.12-.22.07-.47-.12-.61l-2.01-1.58zM12 15.6c-1.98 0-3.6-1.62-3.6-3.6s1.62-3.6 3.6-3.6 3.6 1.62 3.6 3.6-1.62 3.6-3.6 3.6z"/></svg><span class="btn-text">設定</span></button>
        </div>
    </header>

    <div id="pencil-toolbar">
        <span class="color-group-label">出廠:</span>
        <div class="color-dot selected" style="background:#ff3b30;" onclick="selectPencilColor('#ff3b30', this)"></div>
        <div class="color-dot" style="background:#0071e3;" onclick="selectPencilColor('#0071e3', this)"></div>
        <div class="color-dot" style="background:#34c759;" onclick="selectPencilColor('#34c759', this)"></div>
        <div class="color-dot" style="background:#ffcc00;" onclick="selectPencilColor('#ffcc00', this)"></div>
        <div class="color-dot" style="background:#000000;" onclick="selectPencilColor('#000000', this)"></div>
        
        <div style="width:1px; height:18px; background:rgba(255,255,255,0.2); margin:0 4px;"></div>
        <span class="color-group-label">常用:</span>
        <div id="recent-colors-container" style="display:flex; gap:6px;"></div>
        
        <div class="color-picker-wrapper" title="自訂新顏色">
            <input type="color" id="pencil-custom-picker" onchange="addNewCustomColor(this.value)">
            <div style="width:100%; height:100%; background: linear-gradient(45deg, red, orange, yellow, green, blue, purple);"></div>
        </div>
        
        <div style="width:1px; height:18px; background:rgba(255,255,255,0.2); margin:0 4px;"></div>
        <button onclick="clearAllAnnotations()" style="background:none; border:none; color:#ff4d4d; font-size:12px; cursor:pointer; font-weight:500;">清空</button>
    </div>

    <div class="floating-fullscreen-btn" onclick="toggleFullscreen(event)" id="float-fs-btn"><svg id="fs-icon-enter" viewBox="0 0 24 24"><path d="M7 14H5v5h5v-2H7v-3zm-2-4h2V7h3V5H5v5zm12 7h-3v2h5v-5h-2v3zM14 5v2h3v3h2V5h-5z"/></svg><svg id="fs-icon-exit" viewBox="0 0 24 24" style="display:none;"><path d="M5 16h3v3h2v-5H5v2zm3-8H5v2h5V5H8v3zm6 11h2v-3h3v-2h-5v5zm2-11V5h-2v5h5V8h-3z"/></svg></div>
    <div id="camera-preview-container"><video id="webcam" autoplay playsinline></video></div>
    <div id="score-container"><div id="placeholder"><h3 style="margin-bottom:8px; color: #fff;">ScoreFlow Pro</h3><p style="font-size:13px; margin:0;">點擊上方「載入樂譜」載入 PDF</p></div></div>
    <div class="hud-panel" id="hud"></div>

    <div class="modal-overlay" id="settings-modal" onclick="closeSettings()">
        <div class="modal-card" onclick="event.stopPropagation()">
            <div style="font-weight:600; font-size:15px; text-align:center; margin-bottom:14px;">參數細微調校</div>
            
            <div class="setting-item">
                <div class="setting-label"><span>⏱ 幾何側緣節拍器</span>
                    <select id="metro-switch" onchange="updateMetroState(this.value)" style="width:75px;"><option value="off">關閉</option><option value="on">開啟</option></select>
                </div>
                <div class="setting-label" style="margin-top:6px;"><span>🔊 音訊輸出模式</span>
                    <select id="metro-sound-toggle" onchange="updateMetroSoundToggle(this.value)" style="width:105px;"><option value="muted">🔇 靜音對拍</option><option value="unmuted">🔊 發出聲音</option></select>
                </div>
                <div class="setting-label" style="margin-top:6px;"><span>🎵 高穿透音效選擇</span>
                    <select id="metro-sound-type" onchange="updateMetroSoundType(this.value)" style="width:105px;"><option value="bibi">Bibi 電子音</option><option value="drum">大鼓擊樂</option><option value="clock">古典時鐘</option></select>
                </div>
                <div class="setting-label" style="margin-top:10px; align-items:center;">
                    <span style="font-weight:600; color:#fff;">⚡️ 速度設定 (BPM):</span>
                    <input type="number" min="40" max="240" id="metro-bpm-input" class="num-input" onchange="updateMetroBpm(this.value)">
                </div>
            </div>

            <div class="setting-item">
                <div class="setting-label"><span style="color:#fff; font-weight:600;">⏹ 節拍方塊外觀 (左右對稱)</span></div>
                <div class="setting-label" style="margin-top:4px;"><span>方塊大小: <span id="lbl-m-size">24</span> px</span></div>
                <input type="range" min="12" max="60" step="1" id="cfg-m-size" value="24" oninput="adjustMetroLayout('size', this.value)">
                
                <div class="setting-label" style="margin-top:6px;"><span>垂直高度位置: <span id="lbl-m-top">50</span> %</span></div>
                <input type="range" min="10" max="90" step="1" id="cfg-m-top" value="50" oninput="adjustMetroLayout('top', this.value)">
                
                <div class="setting-label" style="margin-top:6px;"><span>與側邊距離: <span id="lbl-m-edge">16</span> px</span></div>
                <input type="range" min="0" max="100" step="1" id="cfg-m-edge" value="16" oninput="adjustMetroLayout('edge', this.value)">
            </div>

            <div class="setting-item">
                <div class="setting-label"><span>📍 反覆段落錨點設定</span></div>
                <div style="display:flex; gap:8px; margin-top:4px;">
                    <button style="flex:1; background:rgba(255,255,255,0.08); border:none; color:#fff; border-radius:6px; padding:8px; font-size:12px; cursor:pointer;" onclick="setAnchorDirectly('1')">儲存目前高度至 ①</button>
                    <button style="flex:1; background:rgba(255,255,255,0.08); border:none; color:#fff; border-radius:6px; padding:8px; font-size:12px; cursor:pointer;" onclick="setAnchorDirectly('2')">儲存目前高度至 ②</button>
                </div>
            </div>
            <div class="setting-item"><div class="setting-label"><span>🤖 AI 辨識型態</span></div><select id="vision-mode-select" onchange="updateVisionMode(this.value)"><option value="wink">😉 左右單眼眨眼</option><option value="tilt">📐 微幅左右歪頭</option></select></div>
            <div class="setting-item" id="sensitivity-box"><div class="setting-label"><span>🎯 眨眼閾值 (<span id="sens-val">0.14</span>)</span><span class="monitor-text" id="eye-monitor">AI 未啟動</span></div><input type="range" min="0.08" max="0.25" step="0.01" id="sens-slider" value="0.14" oninput="updateSensitivity(this.value)"></div>
            <div class="setting-item"><div class="setting-label"><span>📏 翻動幅度 (px)</span><input type="number" min="10" max="2000" id="step-num-input" class="num-input" onchange="updateStep(this.value)"></div><input type="range" min="50" max="1000" step="10" id="step-slider" value="250" oninput="updateStep(this.value)"></div>
            <div class="setting-item"><div class="setting-label"><span>🎹 MIDI 往下翻</span><span style="color:#ff4d4d; cursor:pointer;" onclick="clearBindings('down')">清空</span></div><div style="display:flex; gap:4px; margin-top:4px; flex-wrap: wrap;" id="bind-list-down"></div><button id="btn-rec-down" style="background:var(--apple-accent); border:none; color:#fff; border-radius:6px; padding:6px; font-size:11px; margin-top:6px; cursor:pointer;" onclick="startRecord('down')">+ 錄製往下翻</button></div>
            <div class="setting-item"><div class="setting-label"><span>🎹 MIDI 往上翻</span><span style="color:#ff4d4d; cursor:pointer;" onclick="clearBindings('up')">清空</span></div><div style="display:flex; gap:4px; margin-top:4px; flex-wrap: wrap;" id="bind-list-up"></div><button id="btn-rec-up" style="background:var(--apple-accent); border:none; color:#fff; border-radius:6px; padding:6px; font-size:11px; margin-top:6px; cursor:pointer;" onclick="startRecord('up')">+ 錄製往上翻</button></div>
            <button class="btn-control" style="width:100%; border-radius:8px; height:36px; margin-top:10px; background:rgba(255,255,255,0.08);" onclick="closeSettings()">完成</button>
        </div>
    </div>

    <script>
        const container = document.getElementById('score-container'), hud = document.getElementById('hud'), modal = document.getElementById('settings-modal'), videoElement = document.getElementById('webcam'), cameraContainer = document.getElementById('camera-preview-container'), midiDot = document.getElementById('midi-dot'), mLeft = document.getElementById('metro-left'), mRight = document.getElementById('metro-right'), pToolbar = document.getElementById('pencil-toolbar');
        let SCROLL_STEP = 250, WINK_SENSITIVITY = 0.14, isDarkModeScore = false, lastVisionTriggerTime = 0, VISION_COOLDOWN = 1000, CONTROL_MODE = 'physical', SELECTED_VISION_MODE = 'wink', recordingTarget = null, faceMesh = null, camera = null, hudTimeout = null, menuTimeout = null;
        let bindings = { down: [{ type: 176, id: 64, desc: '延音踏板' }], up: [] }, bookmarks = {}, currentFileUrl = null, currentFileName = "score.pdf";
        let isMetroOn = false, isMetroAudioOn = false, metroBpm = 60, metroSoundType = 'bibi', metroInterval = null, metroTickCount = 0, audioCtx = null;
        let isPencilMode = false, activeColor = '#ff3b30', anchorTouchTimeout = null;
        
        // 節拍器方塊佈局參數
        let metroSize = 24, metroTop = 50, metroEdge = 16;
        // 使用者常用顏色儲存庫
        let recentColors = ['#9b51e0', '#f2994a', '#56ccf2'];

        function loadSavedSettings() {
            try {
                const saved = localStorage.getItem('scoreflow_settings_v2');
                if (saved) {
                    const parsed = JSON.parse(saved);
                    if (parsed.SCROLL_STEP) { SCROLL_STEP = parsed.SCROLL_STEP; syncStepUI(SCROLL_STEP); }
                    if (parsed.WINK_SENSITIVITY) { WINK_SENSITIVITY = parsed.WINK_SENSITIVITY; document.getElementById('sens-slider').value = WINK_SENSITIVITY; document.getElementById('sens-val').textContent = WINK_SENSITIVITY; }
                    if (parsed.SELECTED_VISION_MODE) { SELECTED_VISION_MODE = parsed.SELECTED_VISION_MODE; document.getElementById('vision-mode-select').value = SELECTED_VISION_MODE; }
                    if (parsed.bindings) { bindings = parsed.bindings; }
                    if (parsed.bookmarks) { bookmarks = parsed.bookmarks; updateAnchorButtonsUI(); }
                    if (parsed.metroBpm) { metroBpm = parsed.metroBpm; } else { metroBpm = 60; }
                    if (parsed.isMetroOn) { isMetroOn = parsed.isMetroOn; document.getElementById('metro-switch').value = isMetroOn ? "on" : "off"; }
                    if (parsed.isMetroAudioOn) { isMetroAudioOn = parsed.isMetroAudioOn; document.getElementById('metro-sound-toggle').value = isMetroAudioOn ? "unmuted" : "muted"; }
                    if (parsed.metroSoundType) { metroSoundType = parsed.metroSoundType; document.getElementById('metro-sound-type').value = metroSoundType; }
                    if (parsed.metroSize) metroSize = parsed.metroSize;
                    if (parsed.metroTop) metroTop = parsed.metroTop;
                    if (parsed.metroEdge) metroEdge = parsed.metroEdge;
                    if (parsed.recentColors) recentColors = parsed.recentColors;
                }
            } catch(e) {}
            
            // 初始化同步 UI
            document.getElementById('metro-bpm-input').value = metroBpm;
            document.getElementById('cfg-m-size').value = metroSize;
            document.getElementById('cfg-m-top').value = metroTop;
            document.getElementById('cfg-m-edge').value = metroEdge;
            document.getElementById('lbl-m-size').textContent = metroSize;
            document.getElementById('lbl-m-top').textContent = metroTop;
            document.getElementById('lbl-m-edge').textContent = metroEdge;
            
            applyMetroStyles();
            renderRecentColors();
            toggleMetronomeTimer();
        }
        
        function saveSettings() { 
            try { 
                localStorage.setItem('scoreflow_settings_v2', JSON.stringify({ 
                    SCROLL_STEP, WINK_SENSITIVITY, SELECTED_VISION_MODE, bindings, bookmarks, 
                    metroBpm, isMetroOn, isMetroAudioOn, metroSoundType,
                    metroSize, metroTop, metroEdge, recentColors
                })); 
            } catch(e){} 
        }

        function syncStepUI(val) { document.getElementById('step-slider').value = val; document.getElementById('step-num-input').value = val; }
        
        // 方塊版面同步調整（絕對左右對稱）
        function adjustMetroLayout(type, val) {
            const v = parseInt(val);
            if (type === 'size') { metroSize = v; document.getElementById('lbl-m-size').textContent = v; }
            if (type === 'top') { metroTop = v; document.getElementById('lbl-m-top').textContent = v; }
            if (type === 'edge') { metroEdge = v; document.getElementById('lbl-m-edge').textContent = v; }
            applyMetroStyles();
            saveSettings();
        }

        function applyMetroStyles() {
            // 左側方塊樣式
            mLeft.style.width = `${metroSize}px`; mLeft.style.height = `${metroSize}px`;
            mLeft.style.top = `${metroTop}%`; mLeft.style.left = `${metroEdge}px`;
            mLeft.style.transform = 'translateY(-50%)';
            // 右側方塊樣式（完全對稱）
            mRight.style.width = `${metroSize}px`; mRight.style.height = `${metroSize}px`;
            mRight.style.top = `${metroTop}%`; mRight.style.right = `${metroEdge}px`;
            mRight.style.transform = 'translateY(-50%)';
            
            // 如果開啟了節拍器，非閃爍時也讓它微亮可見
            if(isMetroOn) { mLeft.style.opacity = "0.2"; mRight.style.opacity = "0.2"; }
            else { mLeft.style.opacity = "0"; mRight.style.opacity = "0"; }
        }

        // 常用顏色管理
        function renderRecentColors() {
            const container = document.getElementById('recent-colors-container');
            container.innerHTML = '';
            recentColors.forEach(color => {
                const dot = document.createElement('div');
                dot.className = 'color-dot';
                dot.style.background = color;
                if(activeColor === color) dot.classList.add('selected');
                dot.onclick = () => selectPencilColor(color, dot);
                container.appendChild(dot);
            });
        }

        function addNewCustomColor(color) {
            activeColor = color;
            // 移除重複
            recentColors = recentColors.filter(c => c !== color);
            // 推入最前，最多保留 3 個
            recentColors.unshift(color);
            if(recentColors.length > 3) recentColors.pop();
            
            document.querySelectorAll('#pencil-toolbar .color-dot').forEach(d => d.classList.remove('selected'));
            renderRecentColors();
            saveSettings();
        }

        function toggleControlMode(e) { if(e) e.stopPropagation(); const btn = document.getElementById('btn-mode'), lbl = document.getElementById('lbl-mode'); if (CONTROL_MODE === 'physical') { CONTROL_MODE = 'vision'; btn.classList.add('active-vision'); if(lbl) lbl.textContent = "AI 視覺"; cameraContainer.style.display = 'block'; showHUD("🤖 AI 啟動"); initFaceMeshEngine(); } else { CONTROL_MODE = 'physical'; btn.classList.remove('active-vision'); if(lbl) lbl.textContent = "已就緒"; cameraContainer.style.display = 'none'; document.getElementById('eye-monitor').textContent = "AI 未啟動"; showHUD("🎹 MIDI/鍵盤"); if (camera) camera.stop(); } }
        
        function togglePencilMode(e) {
            if(e) e.stopPropagation();
            isPencilMode = !isPencilMode;
            document.getElementById('btn-pencil').classList.toggle('active-pencil', isPencilMode);
            document.body.classList.toggle('pencil-locked', isPencilMode);
            pToolbar.style.display = isPencilMode ? 'flex' : 'none';
            showHUD(isPencilMode ? "✏️ 進入畫筆模式 (鎖定滾動)" : "📄 返回讀譜模式");
        }
        
        function selectPencilColor(color, element) {
            activeColor = color;
            document.querySelectorAll('#pencil-toolbar .color-dot').forEach(d => d.classList.remove('selected'));
            element.classList.add('selected');
        }
        
        function clearAllAnnotations() {
            document.querySelectorAll('.annotation-canvas').forEach(canvas => {
                const ctx = canvas.getContext('2d');
                ctx.clearRect(0, 0, canvas.width, canvas.height);
            });
            showHUD("🧹 已清除全譜臨時標記");
        }

        function initAudio() { if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)(); }
        
        // 增強型高穿透音量合成器
        function playMetroSound() {
            if (!isMetroAudioOn) return;
            initAudio();
            const now = audioCtx.currentTime, osc = audioCtx.createOscillator(), gain = audioCtx.createGain();
            if (metroSoundType === 'bibi') {
                osc.type = 'sine'; osc.frequency.setValueAtTime(1500, now); // 高頻數位穿透
                gain.gain.setValueAtTime(1.5, now); gain.gain.exponentialRampToValueAtTime(0.001, now + 0.08);
                osc.connect(gain); gain.connect(audioCtx.destination); osc.start(now); osc.stop(now + 0.08);
            } else if (metroSoundType === 'drum') {
                osc.type = 'sine'; osc.frequency.setValueAtTime(150, now); osc.frequency.exponentialRampToValueAtTime(40, now + 0.15); // 低飽和飽滿衝擊
                gain.gain.setValueAtTime(2.2, now); gain.gain.exponentialRampToValueAtTime(0.001, now + 0.16);
                osc.connect(gain); gain.connect(audioCtx.destination); osc.start(now); osc.stop(now + 0.16);
            } else if (metroSoundType === 'clock') {
                osc.type = 'triangle'; osc.frequency.setValueAtTime(2200, now);
                gain.gain.setValueAtTime(0.9, now); gain.gain.exponentialRampToValueAtTime(0.001, now + 0.03);
                osc.connect(gain); gain.connect(audioCtx.destination); osc.start(now); osc.stop(now + 0.03);
            }
        }
        
        function executeMetroTick() {
            metroTickCount++;
            mLeft.classList.remove('active-flash'); mRight.classList.remove('active-flash');
            if (metroTickCount % 2 === 1) { mLeft.classList.add('active-flash'); }
            else { mRight.classList.add('active-flash'); }
            playMetroSound();
        }
        
        function toggleMetronomeTimer() { clearInterval(metroInterval); if (isMetroOn) { applyMetroStyles(); metroInterval = setInterval(executeMetroTick, 60000 / metroBpm); executeMetroTick(); } else { applyMetroStyles(); } }
        function updateMetroState(val) { isMetroOn = val === "on"; toggleMetronomeTimer(); saveSettings(); }
        function updateMetroSoundToggle(val) { isMetroAudioOn = val === "unmuted"; if(isMetroAudioOn) initAudio(); saveSettings(); }
        function updateMetroSoundType(val) { metroSoundType = val; saveSettings(); }
        function updateMetroBpm(val) { let b = parseInt(val) || 60; if(b < 40) b = 40; if(b > 240) b = 240; metroBpm = b; document.getElementById('metro-bpm-input').value = b; toggleMetronomeTimer(); saveSettings(); }

        function handleAnchorClick(idx, e) {
            if(e) e.stopPropagation();
            if (bookmarks[idx] !== undefined) { container.scrollTo({ top: bookmarks[idx], behavior: 'smooth' }); showHUD(`↩️ 跳轉至反覆段落 ${idx}`); }
            else { recordAnchor(idx); }
        }
        function recordAnchor(idx) { bookmarks[idx] = container.scrollTop; updateAnchorButtonsUI(); showHUD(`📍 已成功記憶反覆點 ${idx}`); saveSettings(); }
        function setAnchorDirectly(idx) { bookmarks[idx] = container.scrollTop; updateAnchorButtonsUI(); showHUD(`📍 已手動儲存反覆點 ${idx}`); saveSettings(); closeSettings(); }
        function updateAnchorButtonsUI() { ['1', '2'].forEach(idx => { const btn = document.getElementById(`btn-anchor-${idx}`); if (bookmarks[idx] !== undefined) { btn.classList.add('has-data'); } else { btn.classList.remove('has-data'); } }); }

        function setupAnchorLongPress() {
            ['1', '2'].forEach(idx => {
                const btn = document.getElementById(`btn-anchor-${idx}`);
                const start = (e) => { e.preventDefault(); clearInterval(anchorTouchTimeout); anchorTouchTimeout = setTimeout(() => { recordAnchor(idx); anchorTouchTimeout = null; }, 900); };
                const cancel = () => { clearInterval(anchorTouchTimeout); };
                btn.addEventListener('mousedown', start); btn.addEventListener('mouseup', cancel); btn.addEventListener('mouseleave', cancel);
                btn.addEventListener('touchstart', start, {passive:false}); btn.addEventListener('touchend', cancel);
            });
        }

        document.addEventListener('keydown', e => {
            if (document.activeElement.tagName === 'INPUT') return;
            if (e.key === ' ') { e.preventDefault(); toggleControlMode(); return; }
            if (e.key === 'f' || e.key === 'F') { e.preventDefault(); toggleFullscreen(); return; }
            if (e.key === 's' || e.key === 'S') { e.preventDefault(); if(modal.classList.contains('open')) closeSettings(); else openSettings(); return; }
            if (CONTROL_MODE !== 'physical') return;
            if (e.key === 'Enter') { e.preventDefault(); scrollLines('down'); }
            else if (e.key === 'Backspace') { e.preventDefault(); scrollLines('up'); }
        });

        function showHUD(msg) { clearTimeout(hudTimeout); hud.textContent = msg; hud.classList.add('show'); hudTimeout = setTimeout(() => { hud.classList.remove('show'); }, 1400); }
        function scrollLines(dir) { container.scrollBy({ top: dir === 'down' ? SCROLL_STEP : -SCROLL_STEP, behavior: 'smooth' }); }
        function openSettings(e) { if(e) e.stopPropagation(); updateBindUI(); modal.classList.add('open'); }
        function closeSettings() { modal.classList.remove('open'); resetRecordButtons(); recordingTarget = null; }
        function updateStep(val) { let n = parseInt(val) || 250; if (n < 10) n = 10; SCROLL_STEP = n; syncStepUI(n); saveSettings(); }
        function updateSensitivity(val) { WINK_SENSITIVITY = parseFloat(val); document.getElementById('sens-val').textContent = val; saveSettings(); }
        function updateVisionMode(val) { SELECTED_VISION_MODE = val; saveSettings(); }
        function toggleDarkScore(e) { if(e) e.stopPropagation(); isDarkModeScore = !isDarkModeScore; document.querySelectorAll('.pdf-page-canvas').forEach(c => c.classList.toggle('dark-score', isDarkModeScore)); document.getElementById('btn-dark').classList.toggle('active-dark', isDarkModeScore); showHUD(isDarkModeScore ? "🌙 深色" : "☀️ 原色"); }
        function updateBindUI() { ['down', 'up'].forEach(t => { const b = document.getElementById(`bind-list-${t}`); b.innerHTML = bindings[t].length === 0 ? '<span style="font-size:11px;color:#555;">未設定</span>' : ''; bindings[t].forEach(v => { const s = document.createElement('span'); s.className = 'bind-tag'; s.textContent = v.desc; b.appendChild(s); }); }); }
        function startRecord(t) { recordingTarget = t; resetRecordButtons(); document.getElementById(`btn-rec-${t}`).textContent = '偵測中...'; document.getElementById(`btn-rec-${t}`).style.background = '#ff9500'; }
        function resetRecordButtons() { ['down', 'up'].forEach(t => { document.getElementById(`btn-rec-${t}`).textContent = '+ 錄製' + (t==='down'?'往下':'往上') + '翻'; document.getElementById(`btn-rec-${t}`).style.background = 'var(--apple-accent)'; }); }
        function clearBindings(t) { bindings[t] = []; updateBindUI(); saveSettings(); showHUD("已清除"); }
        
        if (navigator.requestMIDIAccess) navigator.requestMIDIAccess().then(a => { for (let i of a.inputs.values()) i.onmidimessage = getMIDIMessage; a.onstatechange = () => { midiDot.classList.toggle('connected', a.inputs.size > 0); if (a.inputs.size > 0 && CONTROL_MODE !== 'vision') document.getElementById('lbl-mode').textContent = "已就緒"; }; if(a.inputs.size > 0) midiDot.classList.add('connected'); });
        function getMIDIMessage(m) { const d = m.data; if (!d || d.length < 2) return; const t = d[0] & 0xf0, n = d[1], v = d[2] || 0; let s = n, desc = `鍵位: ${n}`; if (t === 224) { s = v > 70 ? 'pitch_up' : 'pitch_down'; desc = v > 70 ? '變音▲' : '變音▼'; } else if (t === 176 && n === 64) desc = '踏板'; if (recordingTarget) { if (t === 144 || t === 176 || t === 224) { if (!bindings[recordingTarget].some(b => b.type === t && String(b.id) === String(s))) { bindings[recordingTarget].push({ type: t, id: s, desc: desc }); updateBindUI(); saveSettings(); } resetRecordButtons(); recordingTarget = null; } return; } if (CONTROL_MODE !== 'physical') return; if (bindings.down.some(b => t === b.type && String(s) === String(b.id))) { if (t === 144 || v > 60 || String(s).includes('pitch')) scrollLines('down'); } else if (bindings.up.some(b => t === b.type && String(s) === String(b.id))) { if (t === 144 || v > 60 || String(s).includes('pitch')) scrollLines('up'); } }
        function initFaceMeshEngine() { if (faceMesh) { camera.start(); return; } faceMesh = new FaceMesh({locateFile: f => `https://cdn.jsdelivr.net/npm/@mediapipe/face_mesh/${f}`}); faceMesh.setOptions({ maxNumFaces: 1, refineLandmarks: true, minDetectionConfidence: 0.5, minTrackingConfidence: 0.5 }); faceMesh.onResults(onVisionResults); camera = new Camera(videoElement, { onFrame: async () => { if (CONTROL_MODE === 'vision') await faceMesh.send({image: videoElement}); }, width: 320, height: 240 }); camera.start(); }
        function onVisionResults(r) { if (CONTROL_MODE !== 'vision' || !r.multiFaceLandmarks || r.multiFaceLandmarks.length === 0) return; const l = r.multiFaceLandmarks[0], now = performance.now(); const rd = Math.hypot(l[159].y-l[145].y), rw = Math.hypot(l[133].x-l[33].x), ld = Math.hypot(l[386].y-l[374].y), lw = Math.hypot(l[263].x-l[362].x), ta = Math.atan2(l[263].y-l[33].y, l[263].x-l[33].x) * (180/Math.PI); const r_ear = rd/rw, l_ear = ld/lw; if (modal.classList.contains('open')) { document.getElementById('eye-monitor').textContent = `L:${l_ear.toFixed(2)} | R:${r_ear.toFixed(2)}`; } if (now - lastVisionTriggerTime < VISION_COOLDOWN) return; if (SELECTED_VISION_MODE === 'wink') { if (r_ear < WINK_SENSITIVITY && l_ear > (WINK_SENSITIVITY + 0.03)) { scrollLines('down'); lastVisionTriggerTime = now; } else if (l_ear < WINK_SENSITIVITY && r_ear > (WINK_SENSITIVITY + 0.03)) { scrollLines('up'); lastVisionTriggerTime = now; } } else if (SELECTED_VISION_MODE === 'tilt') { if (ta > 4.0) { scrollLines('down'); lastVisionTriggerTime = now; } else if (ta < -4.0) { scrollLines('up'); lastVisionTriggerTime = now; } } }

        function bindDrawingEvents(annCanvas) {
            let isDrawing = false, lastX = 0, lastY = 0; const ctx = annCanvas.getContext('2d');
            const getPos = (e) => { const rect = annCanvas.getBoundingClientRect(); return { x: (e.clientX - rect.left) * (annCanvas.width / rect.width), y: (e.clientY - rect.top) * (annCanvas.height / rect.height) }; };
            annCanvas.addEventListener('pointerdown', e => { if (!isPencilMode) return; isDrawing = true; annCanvas.setPointerCapture(e.pointerId); const pos = getPos(e); lastX = pos.x; lastY = pos.y; });
            annCanvas.addEventListener('pointermove', e => { if (!isDrawing || !isPencilMode) return; const pos = getPos(e); ctx.beginPath(); ctx.moveTo(lastX, lastY); ctx.lineTo(pos.x, pos.y); ctx.strokeStyle = activeColor; ctx.lineWidth = e.pointerType === 'pen' ? Math.max(2, e.pressure * 7) : 4; ctx.lineCap = 'round'; ctx.lineJoin = 'round'; ctx.stroke(); lastX = pos.x; lastY = pos.y; });
            const endDraw = (e) => { if(isDrawing) { annCanvas.releasePointerCapture(e.pointerId); isDrawing = false; } };
            annCanvas.addEventListener('pointerup', endDraw); annCanvas.addEventListener('pointercancel', endDraw);
        }

        document.getElementById('file-input').addEventListener('change', e => {
            const f = e.target.files[0];
            if (f && f.type === "application/pdf") {
                currentFileName = f.name; if (currentFileUrl) URL.revokeObjectURL(currentFileUrl);
                currentFileUrl = URL.createObjectURL(f); container.innerHTML = '';
                pdfjsLib.getDocument(currentFileUrl).promise.then(p => {
                    for (let i = 1; i <= p.numPages; i++) {
                        const wrapper = document.createElement('div'); wrapper.className = 'page-wrapper';
                        const c = document.createElement('canvas'); c.className = 'pdf-page-canvas';
                        const ann = document.createElement('canvas'); ann.className = 'annotation-canvas';
                        wrapper.appendChild(c); wrapper.appendChild(ann); container.appendChild(wrapper);
                        p.getPage(i).then(pg => {
                            const vp = pg.getViewport({ scale: 2.2 });
                            c.height = vp.height; c.width = vp.width; ann.width = vp.width; ann.height = vp.height;
                            pg.render({ canvasContext: c.getContext('2d'), viewport: vp });
                            bindDrawingEvents(ann);
                        });
                    }
                    showHUD("📄 樂譜載入成功！畫筆圖層就緒");
                });
            }
        });

        // 🧠 【終極熔接技術】匯出包含手寫痕跡的 PDF
        async function triggerPDFExport(e) {
            if(e) e.stopPropagation();
            if(!currentFileUrl) { showHUD("❌ 請先載入一份樂譜"); return; }
            
            showHUD("⏳ 正在跨層熔接畫筆註記，請稍候...");
            
            const { jsPDF } = window.jspdf;
            let pdfDoc = null;
            const wrappers = document.querySelectorAll('.page-wrapper');
            
            for(let i = 0; i < wrappers.length; i++) {
                const wrapper = wrappers[i];
                const origCanvas = wrapper.querySelector('.pdf-page-canvas');
                const annCanvas = wrapper.querySelector('.annotation-canvas');
                
                // 建立乾淨的記憶體暫存 Canvas 用於圖像融合
                const mergeCanvas = document.createElement('canvas');
                mergeCanvas.width = origCanvas.width;
                mergeCanvas.height = origCanvas.height;
                const mCtx = mergeCanvas.getContext('2d');
                
                // 第一層：原 PDF 樂譜底圖 (保持標準原色，避免匯出黑底耗墨)
                mCtx.drawImage(origCanvas, 0, 0);
                // 第二層：疊加透明手寫塗鴉
                mCtx.drawImage(annCanvas, 0, 0);
                
                // 轉換為壓縮的高清 JPEG
                const imgData = mergeCanvas.toDataURL('image/jpeg', 0.88);
                const orientation = origCanvas.width > origCanvas.height ? 'l' : 'p';
                
                if(i === 0) {
                    pdfDoc = new jsPDF({ orientation: orientation, unit: 'px', format: [origCanvas.width, origCanvas.height], compress: true });
                } else {
                    pdfDoc.addPage([origCanvas.width, origCanvas.height], orientation);
                }
                
                pdfDoc.setPage(i + 1);
                pdfDoc.addImage(imgData, 'JPEG', 0, 0, origCanvas.width, origCanvas.height, undefined, 'FAST');
            }
            
            if(pdfDoc) {
                const outputName = currentFileName.replace(".pdf", "_備忘註記.pdf");
                pdfDoc.save(outputName);
                showHUD("✅ 成功匯出包含筆記的 PDF！");
            }
        }

        function toggleFullscreen(e) { if(e) e.stopPropagation(); if (!document.fullscreenElement) { document.documentElement.requestFullscreen().then(() => { document.body.classList.add('fullscreen-mode'); document.getElementById('fs-icon-enter').style.display = 'none'; document.getElementById('fs-icon-exit').style.display = 'block'; }); } else { document.exitFullscreen().then(() => { document.body.classList.remove('fullscreen-mode', 'show-menu'); document.getElementById('fs-icon-enter').style.display = 'block'; document.getElementById('fs-icon-exit').style.display = 'none'; }); } }
        document.addEventListener('fullscreenchange', () => { if (!document.fullscreenElement) { document.body.classList.remove('fullscreen-mode', 'show-menu'); document.getElementById('fs-icon-enter').style.display = 'block'; document.getElementById('fs-icon-exit').style.display = 'none'; } });
        
        window.addEventListener('DOMContentLoaded', () => { loadSavedSettings(); setupAnchorLongPress(); });
    </script>

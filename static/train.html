<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>雙鐵散場特化快查</title>
    
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="default">
    
    <style>
        :root {
            --bg-page: #f5f5f7;
            --bg-card: #ffffff;
            --bg-row: rgba(0, 0, 0, 0.04);
            --bg-segmented: rgba(118, 118, 128, 0.12);
            --bg-btn-active: #ffffff;
            --text-main: #1d1d1f;
            --text-sub: #6e6e73;
            --apple-blue: #0071e3;
            --apple-red: #ff3b30;
            --card-shadow: 0 4px 12px rgba(0, 0, 0, 0.05);
            --border-color: rgba(0, 0, 0, 0.05);
        }

        [data-theme="dark"] {
            --bg-page: #000000;
            --bg-card: #1c1c1e;
            --bg-row: rgba(255, 255, 255, 0.08);
            --bg-segmented: rgba(118, 118, 128, 0.24);
            --bg-btn-active: #636366;
            --text-main: #f5f5f7;
            --text-sub: #86868b;
            --card-shadow: 0 4px 20px rgba(0, 0, 0, 0.3);
            --border-color: rgba(255, 255, 255, 0.1);
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }
        
        body {
            font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "SF Pro Display", sans-serif;
            background-color: var(--bg-page);
            color: var(--text-main);
            transition: background-color 0.2s, color 0.2s;
            -webkit-font-smoothing: antialiased;
            padding: 16px;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .app-container {
            width: 100%;
            max-width: 400px;
            display: flex;
            flex-direction: column;
            gap: 16px;
        }

        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 0 4px;
        }
        .clock { font-family: monospace; font-size: 15px; font-weight: 600; color: var(--text-sub); }
        .theme-btn {
            background: var(--bg-card);
            color: var(--text-main);
            border: 1px solid var(--border-color);
            padding: 6px 14px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: 500;
            cursor: pointer;
            box-shadow: var(--card-shadow);
        }

        .segmented-control {
            display: flex;
            background: var(--bg-segmented);
            padding: 2px;
            border-radius: 9px;
        }
        .segment-btn {
            flex: 1;
            border: none;
            background: none;
            padding: 10px 0;
            font-size: 13px;
            color: var(--text-sub);
            border-radius: 7px;
            cursor: pointer;
        }
        .segment-btn.active {
            background: var(--bg-btn-active);
            color: var(--text-main);
            font-weight: 600;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
        }

        /* 頂部看板大卡片 */
        .hero-card {
            background: linear-gradient(135deg, #1c1c1e 0%, #2c2c2e 100%);
            color: #ffffff;
            border-radius: 16px;
            padding: 18px;
            box-shadow: 0 8px 24px rgba(0,0,0,0.12);
        }
        .hero-title { font-size: 11px; font-weight: 700; color: #aeaeb2; letter-spacing: 0.5px; margin-bottom: 12px; }
        .hero-row { display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px; }
        .hero-row:last-child { margin-bottom: 0; }
        .hero-label { font-size: 14px; color: #e5e5ea; }
        .hero-time { font-family: monospace; font-size: 16px; font-weight: 700; color: #ffffff; margin-left: 6px; }
        .hero-countdown { font-size: 14px; font-weight: 600; color: #64afff; }
        .hero-countdown-num { font-size: 24px; font-weight: 800; font-family: monospace; color: #ffffff; margin: 0 2px; }

        /* 雙鐵並行清單 */
        .timetable-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
        }
        .column-card {
            background: var(--bg-card);
            border-radius: 16px;
            padding: 14px;
            box-shadow: var(--card-shadow);
            border: 1px solid var(--border-color);
        }
        .column-title {
            font-size: 13px;
            font-weight: 700;
            color: var(--text-sub);
            padding-bottom: 8px;
            margin-bottom: 10px;
            border-bottom: 1px solid var(--border-color);
        }
        .time-list {
            display: flex;
            flex-direction: column;
            gap: 6px;
            max-height: 45vh;
            overflow-y: auto;
        }
        .time-list::-webkit-scrollbar { display: none; }

        .time-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 10px 12px;
            border-radius: 10px;
            font-size: 15px;
            font-weight: 500;
            background: var(--bg-row);
            color: var(--text-main);
        }
        .time-value { font-family: monospace; }
        
        .badge-next {
            background: var(--apple-blue) !important;
            color: #ffffff !important;
            font-weight: 700;
        }
        .badge-last {
            background: rgba(255, 59, 48, 0.1) !important;
            color: var(--apple-red) !important;
            border: 1px solid rgba(255, 59, 48, 0.2);
        }
        .status-text { font-size: 10px; font-weight: 700; padding: 1px 4px; border-radius: 4px; }

        footer { text-align: center; font-size: 11px; color: var(--text-sub); margin-top: 8px; }
    </style>
</head>
<body>

    <div class="app-container">
        <header>
            <div id="current-time" class="clock">00:00:00</div>
            <button onclick="toggleTheme()" class="theme-btn">🌓 切換主題</button>
        </header>

        <div class="segmented-control">
            <button onclick="changeDirection('go')" id="tab-go" class="segment-btn active">去程 (新竹發車)</button>
            <button onclick="changeDirection('back')" id="tab-back" class="segment-btn">回程 (散場返竹)</button>
        </div>

        <div class="hero-card">
            <p id="hero-header-text" class="hero-title">NEXT TRANSIT組合 / 轉乘最佳解</p>
            <div id="hero-display"></div>
        </div>

        <div class="timetable-grid">
            <div class="column-card">
                <h3 id="left-title" class="column-title">🚃 六家線</h3>
                <div id="left-list" class="time-list"></div>
            </div>
            <div class="column-card">
                <h3 id="right-title" class="column-title">🚄 台灣高鐵</h3>
                <div id="right-list" class="time-list"></div>
            </div>
        </div>

        <footer>🟢 時刻表已精準校正・祝演唱會順利</footer>
    </div>

    <script>
        // 完全依據官方最新真實班次修正
        const database = {
            go: {
                // 台鐵新竹站發車時間（新竹 ➔ 六家）
                tra: ["11:29", "11:56", "12:29", "12:56", "13:29", "13:56", "14:29", "14:56", "15:29", "15:56", "16:29", "16:56", "17:29", "17:56", "18:29", "18:56", "19:29", "19:56", "20:29", "20:56", "21:29", "21:56", "22:29", "23:02"],
                // 高鐵新竹站發車時間（新竹 ➔ 台北）
                thsr: ["11:58", "12:02", "12:25", "12:58", "13:02", "13:25", "13:58", "14:02", "14:25", "14:58", "15:02", "15:25", "15:58", "16:02", "16:25", "16:58", "17:02", "17:25", "17:58", "18:02", "18:25", "18:58", "19:02", "19:25", "19:58", "20:02", "20:25", "20:58", "21:02", "21:25", "21:58", "22:02", "22:25", "22:58", "23:27"]
            },
            back: {
                // 高鐵台北站發車時間（台北 ➔ 新竹）
                thsr: ["18:11", "18:31", "18:39", "18:51", "19:11", "19:31", "19:39", "19:51", "20:11", "20:31", "20:39", "20:51", "21:11", "21:31", "21:46", "21:51", "22:11", "22:26", "22:36", "22:51", "23:00"],
                // 台鐵六家站發車時間（六家 ➔ 新竹）
                tra: ["18:32", "19:05", "19:32", "20:05", "20:32", "21:05", "21:32", "22:05", "22:38", "23:09", "23:35"]
            }
        };

        let currentDir = 'go';

        function toggleTheme() {
            const isDark = document.documentElement.getAttribute('data-theme') === 'dark';
            document.documentElement.setAttribute('data-theme', isDark ? 'light' : 'dark');
        }

        function changeDirection(dir) {
            currentDir = dir;
            document.getElementById('tab-go').classList.toggle('active', dir === 'go');
            document.getElementById('tab-back').classList.toggle('active', dir === 'back');
            
            if (dir === 'go') {
                document.getElementById('left-title').innerText = "🚃 新竹 ➔ 六家";
                document.getElementById('right-title').innerText = "🚄 新竹 ➔ 台北";
                document.getElementById('hero-header-text').innerText = "去程出發：無縫轉乘黃金鏈";
            } else {
                document.getElementById('left-title').innerText = "🚄 台北 ➔ 新竹";
                document.getElementById('right-title').innerText = "🚃 六家 ➔ 新竹";
                document.getElementById('hero-header-text').innerText = "散場回程：高鐵換台鐵最佳解";
            }
            updateUI();
        }

        function toMins(tStr) {
            const [h, m] = tStr.split(':').map(Number);
            return h * 60 + m;
        }

        function updateUI() {
            const now = new Date();
            const curMins = now.getHours() * 60 + now.getMinutes();
            
            document.getElementById('current-time').innerText = 
                `${String(now.getHours()).padStart(2, '0')}:${String(now.getMinutes()).padStart(2, '0')}:${String(now.getSeconds()).padStart(2, '0')}`;

            const activeData = database[currentDir];
            let nextLeft = "";
            let nextRight = "";

            if (currentDir === 'go') {
                nextLeft = activeData.tra.find(t => toMins(t) >= curMins);
                if (nextLeft) {
                    // 台鐵行駛19分鐘 + 5分鐘高鐵進站緩衝 = 24分鐘最低轉乘限制
                    const minThsrTime = toMins(nextLeft) + 24;
                    nextRight = activeData.thsr.find(t => toMins(t) >= minThsrTime);
                }
            } else {
                nextLeft = activeData.thsr.find(t => toMins(t) >= curMins);
                if (nextLeft) {
                    // 高鐵台北到新竹約30分鐘 + 6分鐘出站換月台緩衝 = 36分鐘限制
                    const minTraTime = toMins(nextLeft) + 36;
                    nextRight = activeData.tra.find(t => toMins(t) >= minTraTime);
                }
            }

            let heroHTML = "";
            if (currentDir === 'go') {
                heroHTML += makeHeroRow("🚃 六家線火車", nextLeft, curMins);
                heroHTML += makeHeroRow("🚄 銜接高鐵班次", nextRight, curMins);
            } else {
                heroHTML += makeHeroRow("🚄 南下高鐵客車", nextLeft, curMins);
                heroHTML += makeHeroRow("🚃 銜接六家回城", nextRight, curMins);
            }
            document.getElementById('hero-display').innerHTML = heroHTML;

            document.getElementById('left-list').innerHTML = makeListHTML(activeData.tra, nextLeft);
            document.getElementById('right-list').innerHTML = makeListHTML(activeData.thsr, nextRight);
        }

        function makeHeroRow(label, timeStr, curMins) {
            if (!timeStr) {
                return `<div class="hero-row"><span class="hero-label">${label}</span><span class="hero-countdown">本日營運結束</span></div>`;
            }
            const diff = toMins(timeStr) - curMins;
            let countdownText = "";
            
            if (diff < 0) {
                countdownText = `<span class="hero-countdown" style="color:#ff453a;">已發車</span>`;
            } else if (diff === 0) {
                countdownText = `<span class="hero-countdown" style="color:#30d158;">即將發車</span>`;
            } else {
                countdownText = `<span class="hero-countdown">還有<span class="hero-countdown-num">${diff}</span>分鐘</span>`;
            }

            return `
                <div class="hero-row">
                    <span class="hero-label">${label}<span class="hero-time">${timeStr}</span></span>
                    ${countdownText}
                </div>
            `;
        }

        function makeListHTML(array, nextTimeStr) {
            const now = new Date();
            const curMins = now.getHours() * 60 + now.getMinutes();
            const lastTrain = array[array.length - 1];
            
            let html = '';
            array.forEach(time => {
                if (toMins(time) < curMins) return; // 自動過濾歷史時間，保持介面極簡

                const isNext = time === nextTimeStr;
                const isLast = time === lastTrain;
                
                let rowClass = "";
                let badge = "";

                if (isNext) {
                    rowClass = "badge-next";
                    badge = `<span class="status-text">NEXT</span>`;
                } else if (isLast) {
                    rowClass = "badge-last";
                    badge = `<span class="status-text">末班</span>`;
                }

                html += `
                    <div class="time-row ${rowClass}">
                        <span class="time-value">${time}</span>
                        ${badge}
                    </div>
                `;
            });
            return html || `<div style="text-align:center; font-size:12px; color:var(--text-sub); padding:10px 0;">已無車次</div>`;
        }

        changeDirection('go');
        setInterval(updateUI, 1000);
    </script>
</body>
</html>
